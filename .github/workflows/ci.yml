name: CI

# Doğrulama harness'ini otomatikleştirir (Faz 1+). Her main push'unda ve PR'da:
#  - backend: 104 golden test (formulaService ≥%90 coverage threshold) + güvenlik audit
#  - frontend: güvenlik audit (critical) + build
# BLOKLAYAN kapılar: testler + audit. Lint/build bilgilendirme (continue-on-error).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — testler + güvenlik
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Golden testler (104) + kapsam eşiği
        run: npm test
      - name: Güvenlik audit (high/critical = 0 zorunlu)
        run: npm audit --audit-level=high
      - name: Lint (bilgilendirme)
        run: npm run lint
        continue-on-error: true

  bridge:
    name: MT5 köprüsü — koruma testleri (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mt5-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # MetaTrader5 paketi Windows-only; testler MT5'i stub'lar → kurulum gerekmez.
      - name: Sözdizimi denetimi
        run: python -m py_compile trade_guard.py borsakrali_mt5.py borsakrali_mt5_all.py borsakrali_mt5_scanner.py
      - name: Günlük zarar devre-kesicisi
        run: python test_trade_guard_daily.py
      - name: Yasaklı enstrüman + lot sınırı (0.01–0.15 · Bot 37 0.20)
        run: python test_ban_lot.py
      - name: Köprü sahipliği (yalnız kendi açtığını siteye bildirir)
        run: python test_bridge_ownership.py

  frontend:
    name: Frontend — güvenlik + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm install — rolldown native-dep cross-platform lock için)
        run: npm install --no-audit --no-fund
      - name: Güvenlik audit (critical = 0 zorunlu)
        run: npm audit --audit-level=critical
      - name: Build (vite, prerender'sız — derleme doğrulama)
        run: npm run build:mobile
        continue-on-error: true
