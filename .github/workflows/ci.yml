name: CI

# Doğrulama harness'ini otomatikleştirir (Faz 1+). Her main push'unda ve PR'da:
#  - backend: 104 golden test (formulaService ≥%90 coverage threshold) + güvenlik audit
#  - frontend: güvenlik audit (critical) + build
# BLOKLAYAN kapılar: testler + audit. Lint/build bilgilendirme (continue-on-error).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — testler + güvenlik
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Golden testler (104) + kapsam eşiği
        run: npm test
      - name: Güvenlik audit (high/critical = 0 zorunlu)
        run: npm audit --audit-level=high
      - name: Lint (bilgilendirme)
        run: npm run lint
        continue-on-error: true

  frontend:
    name: Frontend — güvenlik + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm install — rolldown native-dep cross-platform lock için)
        run: npm install --no-audit --no-fund
      - name: Güvenlik audit (critical = 0 zorunlu)
        run: npm audit --audit-level=critical
      - name: Build (vite, prerender'sız — derleme doğrulama)
        run: npm run build:mobile
        continue-on-error: true
