<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="Borsa Krali — Royal Crypto Tower">
  <defs>
    <!-- Ana altın gradient — kral + kripto -->
    <linearGradient id="rctGold" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.4" stop-color="#e6c45e"/>
      <stop offset="0.7" stop-color="#c89a2c"/>
      <stop offset="1" stop-color="#7a5b0c"/>
    </linearGradient>
    <!-- Yeşil yükselen — borsa boğası -->
    <linearGradient id="rctJade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <!-- Soft soft altın taç için -->
    <linearGradient id="rctCrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- ── TAÇ (üstte, 5-uçlu) ───────────────────────────────────── -->
  <path d="M 22 12
           L 25 6
           L 29 10
           L 32 4
           L 35 10
           L 39 6
           L 42 12
           L 41 15.5
           L 23 15.5 Z"
        fill="url(#rctCrown)"
        stroke="#3b2607"
        stroke-width="0.7"
        stroke-linejoin="round"/>
  <!-- Taç mücevherleri -->
  <circle cx="32" cy="11" r="1.3" fill="#9b2226" stroke="#3b2607" stroke-width="0.3"/>
  <circle cx="27" cy="12.5" r="0.85" fill="#005f73" stroke="#3b2607" stroke-width="0.2"/>
  <circle cx="37" cy="12.5" r="0.85" fill="#005f73" stroke="#3b2607" stroke-width="0.2"/>

  <!-- ── BITCOIN ₿ SEMBOLÜ (merkez, dominant) ──────────────────── -->
  <!-- 2 dikey çubuk üstten -->
  <rect x="26" y="17" width="2.4" height="4" rx="0.4" fill="url(#rctGold)"/>
  <rect x="32.6" y="17" width="2.4" height="4" rx="0.4" fill="url(#rctGold)"/>

  <!-- B gövdesi: sol dikey + 2 yarım daire -->
  <path d="M 21 21
           L 31 21
           Q 39 21, 39 27
           Q 39 31, 35 32
           Q 41 33, 41 38
           Q 41 44, 32 44
           L 21 44 Z"
        fill="url(#rctGold)"
        stroke="#3b2607"
        stroke-width="0.8"
        stroke-linejoin="round"/>
  <!-- B içi: 2 dikey beyaz boşluk + orta çentik -->
  <path d="M 25 24
           L 30 24
           Q 35 24, 35 27
           Q 35 30, 30 30
           L 25 30 Z"
        fill="#0a1020"/>
  <path d="M 25 33.5
           L 31 33.5
           Q 37 33.5, 37 37.5
           Q 37 41, 31 41
           L 25 41 Z"
        fill="#0a1020"/>

  <!-- 2 dikey çubuk alttan -->
  <rect x="26" y="44" width="2.4" height="4" rx="0.4" fill="url(#rctGold)"/>
  <rect x="32.6" y="44" width="2.4" height="4" rx="0.4" fill="url(#rctGold)"/>

  <!-- ── 3 YÜKSELEN MUM (altta, borsa) ─────────────────────────── -->
  <!-- Mum 1 (sol, kısa) -->
  <line x1="14" y1="56" x2="14" y2="52" stroke="url(#rctJade)" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="11.5" y="56" width="5" height="5" rx="0.7" fill="url(#rctJade)"/>
  <line x1="14" y1="61" x2="14" y2="62" stroke="url(#rctJade)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mum 2 (orta) -->
  <line x1="32" y1="55" x2="32" y2="50" stroke="url(#rctJade)" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="29.5" y="55" width="5" height="6" rx="0.7" fill="url(#rctJade)"/>
  <line x1="32" y1="61" x2="32" y2="62" stroke="url(#rctJade)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mum 3 (sağ, en uzun — kralın mumu, altın) -->
  <line x1="50" y1="54" x2="50" y2="49" stroke="url(#rctGold)" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="47.5" y="54" width="5" height="7" rx="0.7" fill="url(#rctGold)"/>
  <line x1="50" y1="61" x2="50" y2="62" stroke="url(#rctGold)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
