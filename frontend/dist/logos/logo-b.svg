<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="Borsa Krali — Taçlı K Monogramı">
  <defs>
    <linearGradient id="goldB" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.45" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#7a5b0c"/>
    </linearGradient>
    <linearGradient id="goldBLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d4af37"/>
