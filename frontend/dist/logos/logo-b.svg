  <circle cx="32" cy="13" r="1.3" fill="#005f73"/>
  <circle cx="38" cy="14" r="1.1" fill="#9b2226"/>

  <!-- K harfi — kalın, modern -->
  <path d="
    M 18 24
    L 25 24
    L 25 36
    L 36 24
    L 44 24
    L 33 36
    L 46 54
    L 38 54
    L 28 40
    L 25 43
    L 25 54
    L 18 54
    Z"
    fill="url(#goldB)" stroke="#3b2607" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Hafif parlak vurgu — sol-üst köşe -->
  <path d="M 19 25 L 24 25 L 24 32 L 19 32 Z" fill="rgba(255,255,255,0.18)"/>
