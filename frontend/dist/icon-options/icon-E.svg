<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="E4_bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F2D45"/>
      <stop offset="1" stop-color="#04101B"/>
    </linearGradient>
    <linearGradient id="E4_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE39A"/>
      <stop offset="0.5" stop-color="#F2A41A"/>
      <stop offset="1" stop-color="#8E4D00"/>
    </linearGradient>
    <linearGradient id="E4_goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5B524"/>
      <stop offset="1" stop-color="#5A3000"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#E4_bg)"/>

  <g stroke="#1B3A55" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <line x1="120" y1="900" x2="904" y2="900"/>
    <line x1="120" y1="820" x2="904" y2="820"/>
  </g>

  <!-- LEFT HORN — emerges from top-left of head, sweeps OUT (horizontal) then UP, sharp tip -->
  <path d="M 360 420
           C 280 380, 200 360, 110 360
           C 130 320, 180 280, 250 270
           C 320 262, 380 280, 410 320
           C 396 360, 380 395, 360 420
           Z"
        fill="url(#E4_gold)" stroke="#5A3000" stroke-width="7" stroke-linejoin="round"/>

  <!-- RIGHT HORN — mirror -->
  <path d="M 664 420
           C 744 380, 824 360, 914 360
           C 894 320, 844 280, 774 270
           C 704 262, 644 280, 614 320
           C 628 360, 644 395, 664 420
           Z"
        fill="url(#E4_gold)" stroke="#5A3000" stroke-width="7" stroke-linejoin="round"/>

  <!-- HEAD — short, broad, wider than tall, like a real bull skull from front -->
  <!-- Forehead (top section) -->
  <path d="M 360 420
           C 360 380, 420 360, 512 360
           C 604 360, 664 380, 664 420
           L 664 510
           L 360 510
           Z"
        fill="url(#E4_gold)" stroke="#5A3000" stroke-width="7" stroke-linejoin="round"/>

  <!-- Lower face — narrows slightly -->
  <path d="M 360 510
           L 664 510
           L 644 640
           L 600 740
           L 512 800
           L 424 740
           L 380 640
           Z"
        fill="url(#E4_gold)" stroke="#5A3000" stroke-width="7" stroke-linejoin="round"/>

  <!-- White forehead blaze (classic bull feature) -->
  <path d="M 488 380 L 536 380 L 528 450 L 496 450 Z"
        fill="#FFE39A" opacity="0.5"/>

  <!-- EYES — angular, fierce -->
  <ellipse cx="438" cy="560" rx="32" ry="20" fill="#1A2030" stroke="#5A3000" stroke-width="3"/>
  <ellipse cx="586" cy="560" rx="32" ry="20" fill="#1A2030" stroke="#5A3000" stroke-width="3"/>
  <circle cx="438" cy="555" r="7" fill="#FFE39A"/>
  <circle cx="586" cy="555" r="7" fill="#FFE39A"/>

  <!-- MUZZLE / SNOUT -->
  <path d="M 432 640
           L 592 640
           L 600 730
           L 560 770
           L 464 770
           L 424 730
           Z"
        fill="url(#E4_goldDark)" stroke="#5A3000" stroke-width="6"/>

  <!-- NOSTRILS — flared -->
  <ellipse cx="476" cy="688" rx="13" ry="18" fill="#1A2030"/>
  <ellipse cx="548" cy="688" rx="13" ry="18" fill="#1A2030"/>

  <!-- MOUTH -->
  <path d="M 472 740 Q 512 760, 552 740" fill="none" stroke="#5A3000" stroke-width="6" stroke-linecap="round"/>

  <!-- CROWN — sits on the forehead between horns -->
  <g transform="translate(512, 270)">
    <path d="M -100 20 L -60 -55 L -32 20 L 0 -85 L 32 20 L 60 -55 L 100 20 Z"
          fill="url(#E4_gold)" stroke="#5A3000" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="-60" cy="-55" r="11" fill="#FF4D6D" stroke="#5A3000" stroke-width="2"/>
    <circle cx="0" cy="-85" r="14" fill="#7BD8FF" stroke="#5A3000" stroke-width="2"/>
    <circle cx="60" cy="-55" r="11" fill="#22D17E" stroke="#5A3000" stroke-width="2"/>
    <rect x="-100" y="20" width="200" height="22" rx="6" fill="url(#E4_goldDark)" stroke="#5A3000" stroke-width="4"/>
  </g>
</svg>
