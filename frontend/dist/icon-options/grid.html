<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Icon Grid</title>
<style>
  body {
    margin: 0;
    background: #0a1220;
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: #e8ecf3;
    padding: 24px;
  }
  h1 { font-size: 22px; color: #FFD46B; margin: 0 0 18px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .item { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px; text-align: center; }
  .item img { width: 100%; aspect-ratio: 1; border-radius: 28px; display: block; }
  .item .lbl { margin-top: 10px; font-weight: 700; color: #FFD46B; font-size: 14px; }
  .item .desc { font-size: 11px; color: #93a8c2; margin-top: 4px; line-height: 1.4; }
</style>
</head>
<body>
<h1>Borsa Krali — 6 Ikon Konsepti</h1>
<div class="row">
  <div class="item"><img src="icon-A.svg"><div class="lbl">A · Soylu Tac</div><div class="desc">Klasik 3-tepe tac, kiymetli taslar</div></div>
  <div class="item"><img src="icon-B.svg"><div class="lbl">B · K Monogram</div><div class="desc">K harfi + tac + bullish ok</div></div>
  <div class="item"><img src="icon-C.svg"><div class="lbl">C · Krali Mum</div><div class="desc">Yesil yukselis mumu + tac</div></div>
  <div class="item"><img src="icon-D.svg"><div class="lbl">D · Mum Taci</div><div class="desc">3 mum tac olusturuyor</div></div>
  <div class="item"><img src="icon-E.svg"><div class="lbl">E · Tac Giymis Boga</div><div class="desc">Wall Street boga + tac</div></div>
  <div class="item"><img src="icon-F.svg"><div class="lbl">F · Altin Madalyon</div><div class="desc">Sikke / kraliyet muhru</div></div>
</div>
</body>
</html>
